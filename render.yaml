services:
  - type: web
    name: linkpulse-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: sh start-render.sh
    healthCheckPath: /health
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: linkpulse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: linkpulse-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: BASE_URL
        fromService:
          name: linkpulse-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: keyvalue
    name: linkpulse-redis
    ipAllowList: []  # private network only -- api reaches it internally
    plan: free
    maxmemoryPolicy: noeviction  # don't evict queued tasks under memory pressure

databases:
  - name: linkpulse-db
    plan: free
