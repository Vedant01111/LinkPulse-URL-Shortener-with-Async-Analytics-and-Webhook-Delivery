services:
  - type: web
    name: linkpulse-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: linkpulse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: linkpulse-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: BASE_URL
        fromService:
          name: linkpulse-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  - type: worker
    name: linkpulse-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A app.tasks.celery_app worker --loglevel=info
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: linkpulse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: linkpulse-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false  # set this to the SAME value the api service generated,
                      # after the first deploy (see README deployment notes)

  - type: keyvalue
    name: linkpulse-redis
    ipAllowList: []  # private network only -- api and worker reach it internally
    plan: free
    maxmemoryPolicy: noeviction  # don't evict queued tasks under memory pressure

databases:
  - name: linkpulse-db
    plan: free
